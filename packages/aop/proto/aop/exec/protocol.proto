syntax = "proto3";

package aop.exec;

option go_package = "github.com/chainreactors/aiscan/aop/exec;exec";

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message Request {
  string command = 1;
  string cwd = 2;
  uint32 timeout_seconds = 3;
  map<string, string> env = 4;
}

message Output {
  Stream stream = 1;
  bytes data = 2;
}

message Result {
  int32 exit_code = 1;
  string state = 2;
  string kill_cause = 3;
}

message ProtocolMessage {
  oneof message {
    Request request = 10;
    Output output = 11;
    Result result = 12;
  }
}
