syntax = "proto3";

package aop;

import "aop/value.proto";

message Resource {
  oneof source {
    bytes data = 1;
    string uri = 2;
  }
  string media_type = 3;
  string filename = 4;
}

message Annotation {
  string type = 1;
  uint64 start = 2;
  uint64 end = 3;
  string title = 4;
  string uri = 5;
  EncodedValue detail = 6;
}

message TextContent {
  string text = 1;
  repeated Annotation annotations = 2;
}

message ReasoningContent {
  string text = 1;
  bytes opaque = 2;
  string opaque_type = 3;
}

message MediaContent {
  string kind = 1;
  Resource resource = 2;
  string transcript = 3;
  EncodedValue detail = 4;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string kind = 3;
  EncodedValue arguments = 4;
  string working_directory = 5;
}

message ToolResult {
  string call_id = 1;
  repeated Content output = 2;
  bool is_error = 3;
  EncodedValue detail = 4;
  string name = 5;
  uint64 duration_ms = 6;
  bool terminate = 7;
}

message OpaqueContent {
  string type = 1;
  EncodedValue value = 2;
}

message Content {
  oneof value {
    TextContent text = 1;
    ReasoningContent reasoning = 2;
    string refusal = 3;
    MediaContent media = 4;
    ToolCall tool_call = 5;
    ToolResult tool_result = 6;
    OpaqueContent opaque = 7;
  }
}

message Message {
  string id = 1;
  string role = 2;
  string name = 3;
  repeated Content content = 4;
}
