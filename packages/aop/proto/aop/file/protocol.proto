syntax = "proto3";

package aop.file;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/chainreactors/aiscan/aop/file;file";

message ReadRequest {
  string path = 1;
  // offset and limit enable bounded reads for large artifacts. A zero limit
  // preserves the original whole-file behavior for older clients.
  int64 offset = 2;
  int32 limit = 3;
}
message WriteRequest { string path = 1; bytes data = 2; }
message ListRequest { string path = 1; }
message MkdirRequest { string path = 1; }
message UploadRequest {
  string session_id = 1;
  string filename = 2;
  string media_type = 3;
  bytes data = 4;
}

message Entry {
  string name = 1;
  bool is_directory = 2;
  int64 size = 3;
}

message Result {
  string path = 1;
  string filename = 2;
  int64 size = 3;
  bytes data = 4;
  repeated Entry entries = 5;
  string media_type = 6;
  // offset is the position of data within the file; size remains the total
  // file size. eof marks the final chunk.
  int64 offset = 7;
  bool eof = 8;
}

// Access is the typed payload used by the observe extension for file facts.
// It is carried by aop.Event.extension, not by this imperative file namespace:
// installing observe(files) is the single way to enable publication. The file
// namespace below remains responsible only for explicit resource operations.

// AccessOp is what happened to the path. EDIT is a targeted patch and WRITE a
// full-content overwrite; both are distinguished from CREATE, which says the
// path did not exist beforehand.
enum AccessOp {
  ACCESS_OP_UNSPECIFIED = 0;
  ACCESS_OP_READ = 1;
  ACCESS_OP_WRITE = 2;
  ACCESS_OP_EDIT = 3;
  ACCESS_OP_CREATE = 4;
  ACCESS_OP_DELETE = 5;
}

// AccessSource is how the access was observed, which is also how far it can be
// trusted. TOOL is an exact record taken inside the tool that performed it.
// SNAPSHOT is derived by diffing the work dir around a shell execution: the
// path and the operation are real, but attribution to that execution is an
// inference, and reads are invisible to it entirely. CONTROL is a file request
// this node served for a peer rather than anything the agent did.
enum AccessSource {
  ACCESS_SOURCE_UNSPECIFIED = 0;
  ACCESS_SOURCE_TOOL = 1;
  ACCESS_SOURCE_SNAPSHOT = 2;
  ACCESS_SOURCE_CONTROL = 3;
}

// Access is one observed file access.
message Access {
  reserved 2;
  string id = 1;
  AccessOp op = 3;
  AccessSource source = 4;
  // path is absolute; work_dir is the execution's working directory, carried so
  // a consumer can present the path relative to it without guessing.
  string path = 5;
  string work_dir = 6;
  int64 size = 7;   // file size after the access
  int64 bytes = 8;  // bytes read or written by this access, 0 when unknown
  uint32 edits = 9; // patch count for EDIT
  string digest = 10; // sha256 of the content after a write, when computed
  string error = 11;
  google.protobuf.Timestamp timestamp = 12;
}

message ProtocolMessage {
  reserved 21 to 23;
  oneof message {
    ReadRequest read_request = 10;
    WriteRequest write_request = 11;
    ListRequest list_request = 12;
    MkdirRequest mkdir_request = 13;
    UploadRequest upload_request = 14;
    Result result = 20;
  }
}
